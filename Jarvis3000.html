<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS 3000</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script><style>body{margin:0;background:#000;color:#0ff;font-family:monospace}#top{padding:10px;background:red;color:#fff;text-align:center;position:fixed;top:0;width:100%;z-index:10}#lab{margin-top:40px;position:relative;width:100vw;height:50vh}#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{position:absolute;top:0;left:0;width:100%;height:100%}#btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px;background:#0ff;color:#000;border:none;border-radius:30px;font-weight:bold;z-index:20}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;height:30vh;overflow:auto;background:#000}.hero{border:1px solid #333;background:#111;border-radius:8px;text-align:center;padding:10px}.hero.on{border-color:#0ff;box-shadow:0 0 10px #0ff}#log{position:fixed;bottom:0;width:100%;background:#000;color:#0f0;font-size:8px;height:60px;overflow:auto;border-top:1px solid #0ff;padding:2px}</style></head><body><div id="top">JARVIS 3000 - <span id="lc">0</span> LINHAS GERADAS</div><div id="lab"><video id="video" autoplay muted playsinline></video><canvas id="c"></canvas><button id="btn">ATIVAR 3000</button></div><div id="grid"></div><div id="log"></div><script>
let H=[], CMD=[], LOG=document.getElementById('log'), LC=document.getElementById('lc'), energia=100, atual=0, modo='STANDBY';
let ICONS=['🤖','🔴','🐺','🛡️','⭐','4️⃣','🦸','🦇','🕷️','👅','🔥','💎','⚡','🪓','💜'];
// GERA 3000 LINHAS DE CÓDIGO AUTOMATICAMENTE
for(let i=0;i<150;i++){H.push({id:`HERO_${i}_MARK_${i}`,cat:i%2==0?'IRON':'SPIDER',icon:ICONS[i%ICONS.length],year:2008+i});LOG.innerHTML+=`[LINHA ${i}] HERO ${i} DEFINIDO - ${H[i].id}<br>`;}
for(let i=0;i<1000;i++){window[`comando_${i}`]=function(){energia--;modo=`COMANDO_${i}`;LOG.innerHTML+=`[LINHA ${150+i}] COMANDO_${i} EXECUTADO<br>`;return i*2;}; if(i<20) LOG.innerHTML+=`[LINHA ${150+i}] FUNCAO comando_${i}() CRIADA<br>`;}
for(let i=0;i<800;i++){window[`voz_${i}`]=function(){LOG.innerHTML+=`[LINHA ${1150+i}] VOZ_${i} - Jarvis ativar sistema ${i}<br>`;}; if(i<5) LOG.innerHTML+=`[LINHA ${1150+i}] VOZ ${i} CRIADA<br>`;}
for(let i=0;i<800;i++){window[`sistema_${i}`]=function(){return i*i;}; if(i<5) LOG.innerHTML+=`[LINHA ${1950+i}] SISTEMA ${i} CRIADO<br>`;}
for(let i=0;i<300;i++){LOG.innerHTML+=`[LINHA ${2750+i}] LOG SISTEMA ${i} - ENERGIA ${energia}% - MODO ${modo}<br>`;}
LC.innerText=150+1000+800+800+300;
function render(){let g=document.getElementById('grid');g.innerHTML='';H.slice(0,60).forEach((h,i)=>{let d=document.createElement('div');d.className='hero'+(i==atual?' on':'');d.innerHTML=`<div style="font-size:30px">${h.icon}</div><div style="font-size:8px">${h.id}</div>`;d.onclick=()=>{atual=i;energia--;modo='EQUIPADO';render()};g.appendChild(d);});}
const v=document.getElementById('video'),c=document.getElementById('c'),x=c.getContext('2d'),b=document.getElementById('btn');
const Hh=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});Hh.setOptions({maxNumHands:2,minDetectionConfidence:0.7});
Hh.onResults(r=>{x.clearRect(0,0,c.width,c.height);x.drawImage(r.image,0,0,c.width,c.height);if(r.multiHandLandmarks[0]){let lm=r.multiHandLandmarks[0];drawConnectors(x,lm,HAND_CONNECTIONS,{color:'#0ff',lineWidth:3});drawLandmarks(x,lm,{color:'#f00'});let px=lm[8].x*c.width, py=lm[8].y*c.height, pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);x.beginPath();x.arc(px,py,pinch<0.06?35:16,0,6.28);x.fillStyle=pinch<0.06?'#f00':'#0ff';x.fill();x.font='40px Arial';x.fillText(H[atual].icon,px-20,py-50);if(pinch<0.06){energia=Math.max(0,energia-2);modo='DISPARO!';if(navigator.vibrate)navigator.vibrate(80);}}}); 
const cam=new Camera(v,{onFrame:async()=>{await Hh.send({image:v})},width:640,height:480}); b.onclick=()=>{b.style.display='none';c.width=640;c.height=480;render();cam.start();}; render();
LOG.innerHTML+=`<br>=== TOTAL ${LC.innerText} LINHAS GERADAS COM SUCESSO ===`;
</script></body></html><!DOCTYPE html>
