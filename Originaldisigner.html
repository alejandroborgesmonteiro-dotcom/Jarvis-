<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEU CRIADOR - FIX COR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a14; color:#00f0ff; font-family:monospace; height:100vh; display:flex}
.left{width:32%; background:#000d20; border-right:2px solid #00f0ff; padding:10px; overflow-y:auto}
.right{width:68%; display:flex; flex-direction:column; align-items:center; justify-content:center; background: radial-gradient(circle, #0a2340, #02060f)}
.suit{width:320px; height:70vh; border-radius:20px; overflow:hidden; box-shadow:0 0 50px #00f0ff; background:#111; position:relative}
.pt{height:38%; display:flex; align-items:center; justify-content:center; position:relative}
.pm{height:10%; border-top:2px solid #000; border-bottom:2px solid #000}
.pb{height:52%; display:flex}
.leg{width:50%; height:100%}
.emb{font-size:45px; z-index:2}
.eyes{position:absolute; top:5%; left:50%; transform:translateX(-50%); width:140px; display:flex; justify-content:space-between; z-index:10}
.eye{width:55px; height:35px; background:radial-gradient(#fff, var(--ec,#7df9ff)); border:2px solid #000; box-shadow:0 0 12px var(--ec); border-radius:0 60% 0 60%}
input,select{width:100%; margin:4px 0 8px; padding:5px; background:#001a33; border:1px solid #00f0ff; color:#00f0ff; border-radius:5px}
.btn{width:100%; padding:8px; margin-top:6px; border:1px solid #00f0ff; background:rgba(0,240,255,0.15); color:#00f0ff; border-radius:15px; cursor:pointer; font-weight:bold}
</style>
</head>
<body>
<div class="left">
<h3 style="text-align:center; font-size:12px">MEU CRIADOR 100% CUSTOM - FIX</h3>
<label>SEU NOME</label><input id="nome" value="MEU TRAJE MK-1" oninput="upd()">
<label>COR PEITO 1</label><input type="color" id="c1" value="#e53935" oninput="upd()">
<label>COR PEITO 2</label><input type="color" id="c2" value="#8e0e0e" oninput="upd()">
<label>COR PERNA 1</label><input type="color" id="c3" value="#0d47a1" oninput="upd()">
<label>COR PERNA 2</label><input type="color" id="c4" value="#001a4d" oninput="upd()">
<label>COR OLHO</label><input type="color" id="ec" value="#7df9ff" oninput="upd()">
<label>SÍMBOLO</label>
<select id="sym" onchange="upd()">
<option>🕷️</option><option>⚡</option><option>🛡️</option><option>🔥</option><option>🐺</option><option>Q</option><option>A</option><option>J</option>
</select>
<label>BRILHO OLHO</label><input type="range" id="eh" min="10" max="60" value="35" oninput="upd()">
<button class="btn" onclick="alert('TRAJE SALVO! '+nome.value)">[SALVAR]</button>
</div>
<div class="right">
<div class="suit">
<div id="pt" class="pt"><div id="emb" class="emb">🕷️</div></div>
<div id="pm" class="pm"></div>
<div class="pb"><div id="pl" class="leg"></div><div id="pr" class="leg"></div></div>
<div class="eyes"><div id="e1" class="eye"></div><div id="e2" class="eye" style="border-radius:60% 0 60% 0"></div></div>
</div>
<div id="dn" style="margin-top:10px; font-weight:bold">MEU TRAJE MK-1</div>
</div>
<script>
function upd(){
pt.style.background=`linear-gradient(180deg, ${c1.value}, ${c2.value})`;
pm.style.background=c3.value;
pl.style.background=`linear-gradient(180deg, ${c3.value}, ${c4.value})`;
pr.style.background=`linear-gradient(180deg, ${c3.value}, ${c4.value})`;
document.documentElement.style.setProperty('--ec', ec.value);
e1.style.height=eh.value+'px'; e2.style.height=eh.value+'px';
emb.textContent=sym.value;
dn.textContent=nome.value;
}
upd();
</script>
</body>
  </html>
