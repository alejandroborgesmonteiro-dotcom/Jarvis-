<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEU CRIADOR DE TRAJES - 100% CUSTOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050a14; color:#00f0ff; font-family:monospace; height:100vh; display:flex}
.left{width:32%; background:rgba(0,15,30,0.9); border-right:2px solid #00f0ff; padding:12px; overflow-y:auto}
.right{width:68%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; background: radial-gradient(circle at 50% 20%, #0a2340 0%, #02060f 70%)}
h1{font-size:14px; text-align:center; margin-bottom:10px; text-shadow:0 0 10px #00f0ff; letter-spacing:2px}
label{font-size:10px; color:#fff; margin-top:10px; display:block}
input, select{width:100%; margin:4px 0 8px 0; padding:6px; background:#001a33; border:1px solid #00f0ff; color:#00f0ff; border-radius:5px; font-size:11px}
.color-row{display:flex; gap:6px}
.color-row input{flex:1; height:35px; padding:0; cursor:pointer}
.suit-preview{width:340px; height:72vh; position:relative; border-radius:20px; overflow:hidden; box-shadow:0 0 60px var(--glow,#00f0ff); background:#111; transition:0.3s}
.part{position:absolute; width:100%; transition:0.3s}
.top{top:0; height:38%; clip-path: polygon(15% 0,85% 0,100% 20%,100% 100%,0 100%,0 20%); display:flex; align-items:center; justify-content:center}
.mid{top:38%; height:10%; display:flex; align-items:center; justify-content:center; border-top:2px solid #000; border-bottom:2px solid #000}
.bottom{top:48%; height:52%; display:flex}
.leg{width:50%; height:100%}
.emblem{font-size:42px; filter: drop-shadow(0 0 8px silver); z-index:2}
.eyes{position:absolute; top:4%; left:50%; transform:translateX(-50%); width:150px; height:60px; display:flex; justify-content:space-between; z-index:5}
.eye{width:60px; height:var(--eyeH,40px); background: radial-gradient(ellipse, #fff 0%, var(--eyeColor,#7df9ff) 60%, #000 100%); border:2px solid #000; box-shadow:0 0 15px var(--eyeColor); border-radius: 0 60% 0 60%; transition:0.3s}
.eye2{border-radius: 60% 0 60% 0}
.web{position:absolute; inset:0; opacity:var(--webO,0.25); background: repeating-linear-gradient(0deg, transparent 0 16px, rgba(0,0,0,0.7) 17px), repeating-linear-gradient(90deg, transparent 0 16px, rgba(0,0,0,0.7) 17px); pointer-events:none}
.btn{width:100%; padding:10px; margin-top:8px; border:1px solid #00f0ff; background: rgba(0,240,255,0.15); color:#00f0ff; border-radius:20px; cursor:pointer; font-weight:bold; font-size:11px; letter-spacing:1px}
.btn:hover{background:#00f0ff; color:#000; box-shadow:0 0 15px #00f0ff}
.range{width:100%}
</style>
</head>
<body>
<div class="left">
<h1>MEU CRIADOR<br>100% CUSTOM</h1>

<label>SEU NOME DO TRAJE</label>
<input id="nome" value="MEU TRAJE MK-1" oninput="update()">

<label>COR PRINCIPAL (PEITO)</label>
<div class="color-row">
<input type="color" id="corTop" value="#e53935" oninput="update()">
<input type="color" id="corTop2" value="#8e0e0e" oninput="update()">
</div>

<label>COR SECUNDÁRIA (PERNAS)</label>
<div class="color-row">
<input type="color" id="corBot" value="#0d47a1" oninput="update()">
<input type="color" id="corBot2" value="#081f3d" oninput="update()">
</div>

<label>COR DOS OLHOS</label>
<input type="color" id="eyeColor" value="#7df9ff" oninput="update()">

<label>SEU SÍMBOLO / EMBLEMA</label>
<select id="emblema" onchange="update()">
<option>🕷️ Aranha</option>
<option>⚡ Raio</option>
<option>🛡️ Escudo</option>
<option>🔥 Fogo</option>
<option>❄️ Gelo</option>
<option>🦇 Morcego</option>
<option>🐺 Lobo</option>
<option>🦅 Águia</option>
<option>⭐ Estrela</option>
<option>💀 Caveira</option>
<option>Letra - A</option>
<option>Letra - J</option>
<option>Letra - Q</option>
<option>SEU NOME</option>
</select>

<label>TAMANHO DO OLHO: <span id="eyeVal">40px</span></label>
<input type="range" class="range" id="eyeSize" min="5" max="65" value="40" oninput="update()">

<label>TEIA / TEXTURA: <span id="webVal">25%</span></label>
<input type="range" class="range" id="web" min="0" max="100" value="25" oninput="update()">

<label>MÚSCULO MARCADO: <span id="muscleVal">85%</span></label>
<input type="range" class="range" id="muscle" min="0" max="100" value="85" oninput="update()">

<label>MATERIAL</label>
<select id="material" onchange="update()">
<option>KEVLAR REAL</option>
<option>NANO-TECH</option>
<option>METAL TÁTICO</option>
<option>TECIDO COMPRESSION</option>
<option>CARBONO</option>
<option>STEALTH</option>
</select>

<button class="btn" onclick="salvar()">[SALVAR MEU TRAJE]</button>
<button class="btn" onclick="aleatorio()">[GERAR ALEATÓRIO]</button>
<button class="btn" onclick="location.reload()">[RESETAR]</button>
<div style="font-size:9px; margin-top:10px; opacity:0.6; text-align:center">CRIADO POR VOCÊ - 100% ORIGINAL<br>STARK JET LAB CUSTOM</div>
</div>

<div class="right">
<div id="preview" class="suit-preview">
<div class="web" id="webLayer"></div>
<div id="top" class="part top"><div id="emb" class="emblem">🕷️</div></div>
<div id="mid" class="part mid"></div>
<div class="part bottom">
<div id="legL" class="leg" style="border-radius:0 0 0 20px"></div>
<div id="legR" class="leg" style="border-radius:0 0 20px 0"></div>
</div>
<div class="eyes"><div id="eye1" class="eye"></div><div id="eye2" class="eye eye2"></div></div>
</div>
<div style="margin-top:15px; font-size:11px; text-align:center">
<div id="displayNome" style="font-size:16px; font-weight:bold; text-shadow:0 0 10px #00f0ff">MEU TRAJE MK-1</div>
<div id="displayMat" style="font-size:10px; opacity:0.7">KEVLAR REAL - MUSCLE 85%</div>
</div>
</div>

<script>
function update(){
const ct1=corTop.value, ct2=corTop2.value, cb1=corBot.value, cb2=corBot2.value;
top.style.background=`linear-gradient(180deg, ${ct1}, ${ct2})`;
mid.style.background=`linear-gradient(90deg, ${cb1}, ${cb1})`;
legL.style.background=`linear-gradient(180deg, ${cb1}, ${cb2})`;
legR.style.background=`linear-gradient(180deg, ${cb1}, ${cb2})`;
document.documentElement.style.setProperty('--eyeColor', eyeColor.value);
document.documentElement.style.setProperty('--eyeH', eyeSize.value+'px');
eyeVal.textContent=eyeSize.value+'px';
document.documentElement.style.setProperty('--webO', web.value/100);
webVal.textContent=web.value+'%';
muscleVal.textContent=muscle.value+'%';
let m = muscle.value;
top.style.filter=`contrast(${1+m/200}) brightness(${1+m/300})`;
emb.textContent = emblema.value.includes('Letra') ? emblema.value.split('-')[1].trim() : emblema.value.includes('SEU NOME') ? nome.value[0] : emblema.value.split(' ')[0];
displayNome.textContent = nome.value;
displayMat.textContent = `${material.value} - MUSCLE ${muscle.value}% - EYES ${eyeSize.value}px`;
preview.style.setProperty('--glow', eyeColor.value);
}
function salvar(){alert('TRAJE SALVO!\\nNome: '+nome.value+'\\nMaterial: '+material.value+'\\n\\nEsse é 100% SEU! Parabéns criador!');}
function aleatorio(){
const cores=['#e53935','#0d47a1','#000000','#FFD700','#00ff88','#ff00ff','#ff6d00'];
corTop.value=cores[Math.floor(Math.random()*cores.length)];
corBot.value=cores[Math.floor(Math.random()*cores.length)];
eyeColor.value=cores[Math.floor(Math.random()*cores.length)];
eyeSize.value=Math.floor(Math.random()*60)+10;
muscle.value=Math.floor(Math.random()*100);
emblema.selectedIndex=Math.floor(Math.random()*emblema.options.length);
update();
}
update();
</script>
</body>
  </html>
