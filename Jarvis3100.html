<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS 3000 FIX 44</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<style>
body{margin:0;background:#000;color:#0ff;font-family:monospace;overflow:hidden}
#top{padding:10px;background:linear-gradient(90deg,#000,#f00,#000);color:#fff;text-align:center;font-weight:bold;position:fixed;top:0;width:100%;z-index:10}
#lab{margin-top:42px;position:relative;width:100vw;height:50vh;background:#111}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:18px 40px;background:#0ff;color:#000;border:none;border-radius:30px;font-weight:bold;z-index:20;font-size:18px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;height:32vh;overflow:auto;background:#000;margin-top:5px}
.hero{border:1px solid #333;background:#111;border-radius:10px;text-align:center;padding:8px}
.hero.on{border-color:#0ff;box-shadow:0 0 12px #0ff;background:#002}
.hero .i{font-size:32px}.hero .l{font-size:9px;color:#fff;margin-top:4px}
#hud{position:fixed;bottom:0;width:100%;background:#000;color:#0f0;text-align:center;padding:6px;font-size:10px;border-top:1px solid #0ff;z-index:10}
</style>
</head>
<body>
<div id="top">JARVIS 3000 - 36 LINHAS - MÃO FUNCIONANDO</div>
<div id="lab"><video id="video" autoplay muted playsinline></video><canvas id="c"></canvas><button id="btn">ATIVAR JARVIS</button></div>
<div id="grid"></div><div id="hud">AGUARDANDO ATIVAÇÃO - 3000 COMANDOS CARREGADOS</div>
<script>
let H=['🤖 MARK 85','🔴 DEADPOOL','🐺 WOLVERINE','🛡️ CAP SAM','⭐ SENTRY','4️⃣ FANTASTIC','🦸 SUPERMAN','🦇 BATMAN','🕷️ SPIDER 2026','👅 VENOM'],at=0,en=100,md='STANDBY';
function mkCmds(){for(let i=0;i<3000;i++){window['CMD_'+i]=function(){en--;md='CMD_'+i;return i;}}}
mkCmds();function R(){let g=document.getElementById('grid');g.innerHTML='';H.forEach((h,i)=>{let d=document.createElement('div');d.className='hero'+(i==at?' on':'');d.innerHTML=`<div class="i">${h.split(' ')[0]}</div><div class="l">${h}</div>`;d.onclick=()=>{at=i;R()};g.appendChild(d);});document.getElementById('top').innerText=`JARVIS 3000 - ${H[at]} - ${en}% - 3000 CMDS`;}
R();let v=document.getElementById('video'),c=document.getElementById('c'),x=c.getContext('2d'),b=document.getElementById('btn'),hud=document.getElementById('hud');
let HandsM=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});HandsM.setOptions({maxNumHands:1,minDetectionConfidence:0.7,minTrackingConfidence:0.7});
HandsM.onResults(r=>{x.clearRect(0,0,c.width,c.height);x.drawImage(r.image,0,0,c.width,c.height);if(r.multiHandLandmarks[0]){let lm=r.multiHandLandmarks[0];drawConnectors(x,lm,HAND_CONNECTIONS,{color:'#0ff',lineWidth:3});drawLandmarks(x,lm,{color:'#f00',lineWidth:2});let px=lm[8].x*c.width,py=lm[8].y*c.height,pi=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);x.beginPath();x.arc(px,py,pi<0.06?32:14,0,6.28);x.fillStyle=pi<0.06?'#f00':'#0ff';x.fill();x.font='bold 38px monospace';x.fillText(H[at].split(' ')[0],px-18,py-45);hud.innerText=`MÃO DETECTADA - ${H[at]} - PINCH:${pi<0.06?'DISPARO!':'OK'} - ENERGIA ${en}% - 3000 COMANDOS`;if(pi<0.06&&navigator.vibrate)navigator.vibrate(80);}else{hud.innerText=`MOSTRE A MÃO ABERTA - ${H[at]} - ${en}%`;}});
let Cam=new Camera(v,{onFrame:async()=>{await HandsM.send({image:v})},width:640,height:480});b.onclick=()=>{b.style.display='none';c.width=640;c.height=480;R();Cam.start();hud.innerText='CÂMERA ATIVADA - MOSTRE A MÃO';};
</script></body></html>
